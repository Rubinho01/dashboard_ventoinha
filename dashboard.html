<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventilação IoT</title>
<style>
body{font-family:sans-serif;margin:0;padding:12px;background:#111;color:#eee;text-align:center}
.cartao{max-width:360px;margin:10px auto;padding:14px;border-radius:12px;background:#1d1d1d}
.valor{font-size:34px;font-weight:bold;margin:4px 0}
.rotulo{font-size:13px;color:#aaa}
.on{color:#4caf50}
.off{color:#ef5350}
#conexao,#disp{font-size:18px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:12px auto}
button{height:70px;font-size:17px;border:0;border-radius:12px;background:#2d6cdf;color:#fff}
button:active{background:#1b4aa0}
#bOff{background:#c62828}
#bAuto{background:#2e7d32}
#log{font:12px monospace;text-align:left;color:#9ad;white-space:pre-wrap;margin-top:6px}
</style></head><body>
<h2>Ventilação da sala</h2>
<div class="cartao"><div class="rotulo">Broker MQTT</div><div id="conexao" class="valor">Conectando...</div></div>
<div class="cartao"><div class="rotulo">Dispositivo (ESP32)</div><div id="disp" class="valor">--</div></div>
<div class="cartao"><div class="rotulo">Temperatura</div><div id="temp" class="valor">-- °C</div><div id="idade" class="rotulo">sem leitura ainda</div></div>
<div class="cartao"><div class="rotulo">Ventoinha</div><div id="estado" class="valor">--</div><div id="modo" class="rotulo">Modo: --</div><div id="pend" class="rotulo">&nbsp;</div></div>
<div class="grade"><button id="bOn">LIGAR</button><button id="bOff">DESLIGAR</button><button id="bAuto">AUTO</button></div>
<div class="cartao"><div class="rotulo">Mensagens MQTT recebidas</div><div id="log"></div></div>
<script>
// ================= CONFIGURAÇÃO =================
var CONFIG = {
  host:    location.hostname || 'localhost',   // IP/domínio do Mosquitto. Servido pelo PC do broker, já pega sozinho.
  porta:   9001,                               // porta WebSocket do Mosquitto (broker na nuvem: ex. 8884)
  ssl:     location.protocol === 'https:',     // true = wss:// (obrigatório se a página estiver em https)
  caminho: '',                                 // alguns brokers pedem '/mqtt'
  usuario: '',                                 // deixe '' se o broker aceitar anônimos
  senha:   '',
  base:    'casa/ventoinha'                    // mesmo valor de BASE no firmware
};
// ================================================

var BASE=CONFIG.base+'/', T_SET=BASE+'set';
var enc=new TextEncoder(), dec=new TextDecoder();
var ws=null, rx=new Uint8Array(0), pingId=null, ultimaMsg=0, pendente=null, dispOnline=null, linhas=[];
function $(i){return document.getElementById(i);}

// ---- Mini cliente MQTT 3.1.1 sobre WebSocket (sem bibliotecas externas) ----
function varlen(n){var a=[];do{var b=n%128;n=Math.floor(n/128);if(n>0)b|=128;a.push(b);}while(n>0);return a;}
function txt(s){var b=Array.from(enc.encode(s));return [b.length>>8,b.length&255].concat(b);}
function pacote(cab,corpo){return new Uint8Array([cab].concat(varlen(corpo.length),corpo));}
function enviarMQTT(p){if(ws&&ws.readyState===1)ws.send(p);}
function publicar(topico,msg){enviarMQTT(pacote(0x30,txt(topico).concat(Array.from(enc.encode(msg)))));}  // QoS 0, sem retain

function conectar(){
  $('conexao').textContent='Conectando...';
  rx=new Uint8Array(0);
  var url=(CONFIG.ssl?'wss://':'ws://')+CONFIG.host+':'+CONFIG.porta+CONFIG.caminho;
  ws=new WebSocket(url,'mqtt');
  ws.binaryType='arraybuffer';
  ws.onopen=function(){
    var id='painel-'+Math.random().toString(16).slice(2,8);
    var temAuth=CONFIG.usuario!=='';
    var flags=temAuth?0xC2:0x02;                       // clean session (+ usuário e senha)
    var corpo=[0,4,77,81,84,84,4,flags,0,30].concat(txt(id));
    if(temAuth)corpo=corpo.concat(txt(CONFIG.usuario),txt(CONFIG.senha));
    enviarMQTT(pacote(0x10,corpo));
  };
  ws.onmessage=function(ev){
    if(typeof ev.data==='string')return;
    var n=new Uint8Array(ev.data), t=new Uint8Array(rx.length+n.length);
    t.set(rx);t.set(n,rx.length);rx=t;processar();
  };
  ws.onclose=function(){
    clearInterval(pingId);
    $('conexao').textContent='DESCONECTADO (tentando de novo...)';
    setTimeout(conectar,3000);
  };
}

function processar(){
  while(rx.length>=2){
    var mult=1,len=0,i=1,b;
    do{ if(i>=rx.length)return; b=rx[i++]; len+=(b&127)*mult; mult*=128; }while(b&128);
    if(rx.length<i+len)return;
    var cab=rx[0], corpo=rx.slice(i,i+len);
    rx=rx.slice(i+len);
    tratar(cab,corpo);
  }
}

function tratar(cab,corpo){
  var tipo=cab>>4;
  if(tipo===2){                                   // CONNACK
    if(corpo[1]===0){
      $('conexao').textContent='CONECTADO a '+CONFIG.host+':'+CONFIG.porta;
      enviarMQTT(pacote(0x82,[0,1].concat(txt(BASE+'#'),[0])));   // SUBSCRIBE base/#
      clearInterval(pingId);
      pingId=setInterval(function(){enviarMQTT(new Uint8Array([0xC0,0]));},15000);  // PINGREQ
    }else{
      $('conexao').textContent='RECUSADO pelo broker (codigo '+corpo[1]+'): confira usuário e senha';
    }
  }else if(tipo===3){                             // PUBLISH
    var tl=(corpo[0]<<8)|corpo[1], qos=(cab>>1)&3, ini=2+tl+(qos>0?2:0);
    mensagem(dec.decode(corpo.slice(2,2+tl)),dec.decode(corpo.slice(ini)));
  }
}

// ---- Dashboard ----
function registrar(l){
  linhas.unshift(new Date().toLocaleTimeString()+'  '+l);
  if(linhas.length>8)linhas.pop();
  $('log').textContent=linhas.join('\n');
}

function mensagem(t,m){
  registrar(t+' = '+m);
  if(t===BASE+'status'){
    dispOnline=(m==='online');
    $('disp').textContent=dispOnline?'ONLINE':'OFFLINE';
    $('disp').className='valor '+(dispOnline?'on':'off');
  }else if(t===BASE+'temp'){
    ultimaMsg=Date.now();
    $('temp').textContent=m+' °C';
  }else if(t===BASE+'estado'){
    ultimaMsg=Date.now();
    var on=(m==='ON');
    $('estado').textContent=on?'LIGADA':'DESLIGADA';
    $('estado').className='valor '+(on?'on':'off');
    if(pendente&&(pendente.c==='ON'&&on||pendente.c==='OFF'&&!on)){pendente=null;$('pend').textContent='Confirmado pelo dispositivo';}
  }else if(t===BASE+'modo'){
    $('modo').textContent='Modo: '+(m==='AUTO'?'AUTOMÁTICO (por temperatura)':'MANUAL');
    if(pendente&&pendente.c==='AUTO'&&m==='AUTO'){pendente=null;$('pend').textContent='Confirmado pelo dispositivo';}
  }
}

function comando(c){
  if(!ws||ws.readyState!==1)return;
  if(dispOnline===false){$('pend').textContent='Dispositivo OFFLINE: comando não enviado';return;}
  pendente={c:c,t:Date.now()};
  $('pend').textContent='Comando '+c+' enviado, aguardando confirmação...';
  publicar(T_SET,c);
}
$('bOn').onclick=function(){comando('ON');};
$('bOff').onclick=function(){comando('OFF');};
$('bAuto').onclick=function(){comando('AUTO');};

setInterval(function(){
  if(ultimaMsg){
    var s=Math.round((Date.now()-ultimaMsg)/1000);
    $('idade').textContent=(s>15)?('sem atualização há '+s+' s'):('atualizado há '+s+' s');
  }
  if(pendente&&Date.now()-pendente.t>6000)$('pend').textContent='Sem confirmação do dispositivo';
},1000);

conectar();
</script></body></html>
